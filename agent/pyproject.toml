[project]
name = "socratiq-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[google]>=1.5.8,~=1.5",  # 1.5.8+ required for gemini-3.1-flash-live-preview
    "python-dotenv>=1.0",
]

[project.scripts]
interviewer = "interviewer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
